  m.querySelectorAll('[data-dadd]').forEach(b => b.onclick = () => { getPath(b.dataset.dadd).push(ROW[b.dataset.dadd]()); persist(); render(); });
  m.querySelectorAll('[data-ddel]').forEach(b => b.onclick = () => { const k = b.dataset.ddel.split('.'), i = +k.pop(); getPath(k.join('.')).splice(i, 1); persist(); render(); });
}

/* ---------- 4. Statements ---------- */
function sheetHead(title){
  const c = st.company;
  const NC = FW() === 'nce';
  return `<header><div class="cn">${esc(c.name || (NC ? 'Entity name' : 'Company name'))}</div>${c.cin ? `<div class="cin">${NC ? 'Reg. / PAN' : 'CIN'}: ${esc(c.cin)}</div>` : ''}<div class="tt">${title}</div></header>
    <div class="unitline">(All amounts in ${esc(E.UNITS[c.unit].label)} unless otherwise stated)</div>`;
}
function signBlock(){
  if (FW() === 'nce') {
    const c = st.company, b = (v, ph) => v ? esc(v) : `<span class="blank">${ph}</span>`;
    return `<div class="sign"><div><p>As per our report of even date</p><p><b>For ${b(c.firm,'Firm name')}</b></p><p>Chartered Accountants</p><p>FRN: ${b(c.frn,'_______')}</p><br><p>CA ${b(c.partner,'__________')}</p><p>Partner · M. No. ${b(c.mno,'______')}</p><p>UDIN: ${b(c.udin,'__________________')}</p><p>Place: ${b(c.place,'______')} · Date: ${c.date ? esc(longDate(c.date)) : '<span class="blank">__________</span>'}</p></div>
      <div><p><b>For ${b(c.name,'Entity')}</b></p><br><p>${b(c.dir1,'__________')}</p><p>Partner / Proprietor</p><br><p>${b(c.dir2,'__________')}</p><p>Partner / Proprietor</p></div></div>`;
  }
  const c = st.company, b = (v, ph) => v ? esc(v) : `<span class="blank">${ph}</span>`;
  return `<div class="sign"><div><p>As per our report of even date</p><p><b>For ${b(c.firm,'Firm name')}</b></p><p>Chartered Accountants</p><p>FRN: ${b(c.frn,'_______')}</p><br><p>CA ${b(c.partner,'__________')}</p><p>Partner · M. No. ${b(c.mno,'______')}</p><p>UDIN: ${b(c.udin,'__________________')}</p><p>Place: ${b(c.place,'______')} · Date: ${c.date ? esc(longDate(c.date)) : '<span class="blank">______</span>'}</p></div>
    <div><p><b>For and on behalf of the Board of Directors</b></p><p>${b(c.name,'Company')}</p><br><p>${b(c.dir1,'__________')}</p><p>Director · DIN ${b(c.din1,'________')}</p><br><p>${b(c.dir2,'__________')}</p><p>Director · DIN ${b(c.din2,'________')}</p></div></div>`;
}
function faceRows(rows, dec){
  return rows.map(x => {
    if (x.t === 'title' || x.t === 'group') return `<tr class="${x.t}"><td colspan="4">${esc(x.label)}</td></tr>`;
    if (x.t === 'group2') return `<tr class="l1 ${x.nil?'nil':''}"><td colspan="4">${esc(x.label)}</td></tr>`;
    if (x.t === 'total') return `<tr class="total ${x.strong?'strong':''}"><td>${esc(x.label)}</td><td></td><td class="num">${inr(x.cy,dec)}</td><td class="num">${inr(x.py,dec)}</td></tr>`;
    if (x.t === 'eps') return `<tr class="l1"><td>${esc(x.label)}</td><td></td><td class="num">${x.cy==null?'–':x.cy.toFixed(2)}</td><td class="num">${x.py==null?'–':x.py.toFixed(2)}</td></tr>`;
    const lvl = x.lvl === 0 ? '' : x.t === 'subline' ? 'l2' : 'l1';
    const nil = x.nil && !x.keep ? 'nil' : '';
    return `<tr class="${lvl} ${nil}"><td>${esc(x.label)}</td><td class="nt">${x.noAmt ? (x.note||'') : x.t==='subline' && x.id && x.id.startsWith('TP_') ? '' : (x.note || '')}</td><td class="num">${x.noAmt?'':inr(x.cy,dec)}</td><td class="num">${x.noAmt?'':inr(x.py,dec)}</td></tr>`;
  }).join('');
}
function viewFS(m, r){

      <p class="hint" style="margin-top:14px">Notes 1 to ${Math.max(...Object.values(r.noteNo), 2)} form an integral part of the financial statements.</p>${signBlock()}</div>`;
  else if (view.stmt === 'pl') body = `<div class="sheet">${sheetHead(`Statement of Profit and Loss for the year ended ${esc(cyD)}`)}<div class="scroll"><table class="fs">
      <thead><tr><th>Particulars</th><th style="text-align:center">Note</th><th class="num">${esc(fyLabel(c.fyEnd))}<br>Year ended ${esc(cyD)}</th><th class="num">${esc(fyLabel(c.pyEnd))}<br>Year ended ${esc(pyD)}</th></tr></thead>
      <tbody>${faceRows(r.face.pl, dec)}</tbody></table></div>
      ${FW()==='nce' ? '' : `<p class="hint" style="margin-top:8px">EPS computed under AS 20 on the weighted average shares entered${c.fv ? `; face value ₹${esc(c.fv)} per share` : ''}.</p>`}${signBlock()}</div>`;
  else if (view.stmt === 'cf') {
    const R = x => inr(E.rnd(x, u), dec), pyv = k => (r.cfPyMap && typeof r.cfPyMap[k] === 'number') ? R(r.cfPyMap[k]) : '–';
    const rowsHtml = r.cf.rows.map(x => {
      if (x.t === 'group') return `<tr class="group"><td colspan="3">${esc(x.label)}</td></tr>`;
      if (x.t === 'sub') return `<tr class="l1"><td colspan="3"><i>${esc(x.label)}</i></td></tr>`;
      const cls = x.t === 'grand' ? 'total strong' : (x.t === 'total' || x.t === 'subtotal') ? 'total' : 'l1';
      return `<tr class="${cls}"><td>${esc(x.label)}</td><td class="num">${R(x.v)}</td><td class="num">${pyv(x.key)}</td></tr>`; }).join('');
    body = `<div class="sheet">${sheetHead(`Cash Flow Statement for the year ended ${esc(cyD)}`)}<div class="scroll"><table class="fs">
      <thead><tr><th>Particulars</th><th class="num">${esc(fyLabel(c.fyEnd))}<br>Year ended ${esc(cyD)}</th><th class="num">${esc(fyLabel(c.pyEnd))}<br>Year ended ${esc(pyD)}</th></tr></thead>
      <tbody>${rowsHtml}</tbody></table></div>
      <label class="hint" style="display:flex;gap:6px;align-items:center;margin-top:10px"><input type="checkbox" id="cfEx" style="width:auto" ${st.cfExclDep ? 'checked' : ''}> Treat bank deposits with maturity over three months as investing (not cash equivalents) – a reconciliation to the Balance Sheet figure is then shown</label>
      <p class="hint" style="margin-top:6px">Prepared under the indirect method (AS 3) from the two balance sheets. By default cash and cash equivalents are the Balance Sheet head, so the closing figure agrees to the Balance Sheet.
      ${r.cfPyMap ? '' : 'The previous-year comparative needs the balances at the start of the previous year: refresh from Tally with the updated tool (it brings the PY OpeningBalance column), or roll the year forward from saved statements.'}</p>
      ${r.cf.noPrior ? '<p class="hint" style="color:var(--warn)">No previous-year balances are loaded, so this statement is not meaningful yet.</p>' : ''}${signBlock()}</div>`;
  }
  else body = `<div class="sheet">${sheetHead(`Notes to the financial statements for the year ended ${esc(cyD)}`)}
      ${FW()==='nce' ? `<div class="note"><h4>1. Entity information</h4><p class="hint">To be drafted (Phase 2): constitution (partnership firm / LLP / proprietorship / AOP), registration details, partners and profit-sharing ratio, nature of business.</p></div>
      <div class="note"><h4>2. Significant accounting policies</h4><p class="hint">To be drafted (Phase 2): basis of preparation (historical cost, accrual) and the Accounting Standards applicable to the entity's level; use of estimates; PPE and depreciation; inventories; revenue; employee benefits; taxes.</p></div>`
      : `<div class="note"><h4>1. Corporate information</h4><p class="hint">To be drafted (Phase 2): nature of business, registered office, incorporation details.</p></div>
      <div class="note"><h4>2. Significant accounting policies</h4><p class="hint">To be drafted (Phase 2): basis of preparation under section 133 read with the Companies (Accounting Standards) Rules, 2021; use of estimates; PPE and depreciation; inventories; revenue; employee benefits; taxes.</p></div>`}
      ${r.notes.map(n => noteHTML(n, u)).join('')}${faNotesHTML(r, u)}${dcNotesHTML(r, u)}</div>`;
  if (view.stmt === 'nt') { const tx = dcTextHTML(r); if (tx) body = body.replace(/<div class="note"><h4>1\. (Corporate|Entity) information[\s\S]*?<\/div>\s*<div class="note"><h4>2\. Significant accounting policies[\s\S]*?<\/div>/, tx); }
  m.innerHTML = `<section class="step ${view.shownil?'shownil':''}">
    <div class="subtabs"><div class="seg" role="group" aria-label="Statement">${[['bs','Balance Sheet'],['pl','Profit and Loss'],['cf','Cash Flow'],['nt','Notes']].map(([k,l]) =>
      `<button aria-pressed="${view.stmt===k}" data-s="${k}">${l}</button>`).join('')}</div>
      <label class="hint" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="shownil" style="width:auto" ${view.shownil?'checked':''}> Show nil line items</label></div>
    ${r.unmapped.length ? `<div class="ck warn"><span class="st">Review</span><div><b>${r.unmapped.length} unmapped ledger(s) are excluded</b><p>The statements will not tally until every ledger is mapped.</p></div></div>` : ''}
    ${body}</section>`;
  m.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { view.stmt = b.dataset.s; render(); });
  const cfEx = $('#cfEx'); if (cfEx) cfEx.onchange = e => { st.cfExclDep = e.target.checked; persist(); render(); };
  $('#shownil').onchange = e => { view.shownil = e.target.checked; render(); };
  m.querySelectorAll('button[data-tog]').forEach(b => b.onclick = () => {
    const rows = m.querySelectorAll(`tr[data-of="${b.dataset.tog}"]`); const open = rows[0] && rows[0].hidden;
    rows.forEach(x => x.hidden = !open); b.textContent = (open ? '▾ ' : '▸ ') + b.dataset.n + ' ledgers';
  });
}
/* Companies Act schedule laid out block by block: a heading per block, its classes, and a block total when it holds more than one class */
const CA_KEYS = ['gO', 'gAdd', 'gDisp', 'gC', 'aO', 'dep', 'aDisp', 'aC', 'nbC', 'nbO'];
function caLayout(F){
  const out = [];
  (F.caGroups || []).forEach(g => {
    if (!g.real) { g.classes.forEach(k => out.push({ type: 'cls', k, indent: false })); return; }
    out.push({ type: 'head', name: g.name });
    g.classes.forEach(k => out.push({ type: 'cls', k, indent: true }));
    if (g.classes.length > 1) out.push({ type: 'sub', name: 'Total – ' + g.name, tot: g.tot, count: g.classes.length });
  });
  return out;
}
function faNotesHTML(r, u){
  if (!r.fa) return '';
  const dec = u.dec, R = x => inr(E.rnd(x, u), dec), F = r.fa, D = r.dt, c = st.company;
  const head = ['Class', 'Gross opening', 'Additions', 'Disposals', 'Gross closing', 'Dep. opening', 'For the year', 'On disposals', 'Dep. closing', 'Net closing', 'Net opening'];
  const line = (n, x, cls) => `<tr class="${cls || ''}"><td>${esc(n)}</td>${[x.gO, x.gAdd, x.gDisp, x.gC, x.aO, x.dep, x.aDisp, x.aC, x.nbC, x.nbO].map(v => `<td class="num">${R(v)}</td>`).join('')}</tr>`;
  const ppe = `<div class="note"><h4>Property, Plant and Equipment and Intangible assets – movement (Companies Act, 2013)</h4><div class="scroll"><table class="fs"><thead><tr>${head.map((t, i) => `<th class="${i ? 'num' : ''}">${t}</th>`).join('')}</tr></thead><tbody>
    ${caLayout(F).map(it => it.type === 'head' ? `<tr><td colspan="11"><b>${esc(it.name)}</b></td></tr>` : it.type === 'sub' ? line(it.name, it.tot, 'total') : line((it.indent ? '  ' : '') + it.k.name + ` (${it.k.method}${it.k.method === 'SLM' ? ', ' + it.k.life + ' yrs' : ''})`, it.k.ca)).join('')}${line('Total', F.tot, 'total')}</tbody></table></div>
    <p class="hint">Depreciation is charged on a pro-rata daily basis from the date of addition / up to the date of disposal, at Schedule II useful lives (residual value shown per class).</p></div>`;
  const dt = `<div class="note"><h4>Deferred tax ${D.close >= 0 ? 'liability' : 'asset'} (net) – components (AS 22)</h4><div class="scroll"><table class="fs"><thead><tr><th>Particulars</th><th class="num">${esc(longDate(c.fyEnd))}</th><th class="num">${esc(longDate(c.pyEnd))}</th></tr></thead><tbody>
    <tr><td>Difference between book and tax written down value of fixed assets (× ${D.rate * 100}%)</td><td class="num">${R(D.depClose * D.rate)}</td><td class="num">${R(D.depOpen * D.rate)}</td></tr>
    ${(st.fa.other || []).map(o => `<tr><td>${esc(o.desc || 'Other timing difference')}</td><td class="num">${R((+o.cy || 0) * D.rate)}</td><td class="num">${R((+o.py || 0) * D.rate)}</td></tr>`).join('')}
    <tr class="total"><td>Net deferred tax liability / (asset)</td><td class="num">${R(D.close)}</td><td class="num">${R(D.open)}</td></tr></tbody></table></div></div>`;
  return ppe + dt;
}
function noteHTML(n, u){
  const dec = u.dec, R = x => inr(E.rnd(x, u), dec);
  const rows = n.rows.map((row, i) => {
    const id = `${n.no}_${i}`, k = row.ledgers.length;
    return `<tr><td class="lbl">${esc(row.label)}${k > 1 ? `<button data-tog="${id}" data-n="${k}">▸ ${k} ledgers</button>` : ''}</td><td class="num">${R(row.cy)}</td><td class="num">${R(row.py)}</td></tr>` +
      (k > 1 ? row.ledgers.map(l => `<tr class="led" data-of="${id}" hidden><td>${esc(l.name)}</td><td class="num">${R(l.cy)}</td><td class="num">${R(l.py)}</td></tr>`).join('') : '');
  }).join('');
  const msme = n.id === 'TP' ? '<p class="hint">Disclosures under section 22 of the MSMED Act, 2006 and the ageing schedule are to be added in Phase 3.</p>' : '';
  return `<div class="note"><h4>${n.no}. ${esc(n.title)}</h4><div class="scroll"><table class="fs"><thead><tr><th>Particulars</th><th class="num">${esc(longDate(st.company.fyEnd))}</th><th class="num">${esc(longDate(st.company.pyEnd))}</th></tr></thead>
    <tbody>${rows}<tr class="total"><td>Total</td><td class="num">${R(n.total.cy)}</td><td class="num">${R(n.total.py)}</td></tr></tbody></table></div>${msme}</div>`;
}

/* ---------- 5. Checks & export ---------- */
function viewChk(m, r){
  const order = { error:0, warn:1, info:2, ok:3 }, LBL = { error:'Fix', warn:'Review', info:'Note', ok:'Pass' };
  const cks = r.checks.slice().sort((a,b) => order[a.lvl] - order[b.lvl]);
  const errs = cks.filter(c => c.lvl === 'error').length;
  m.innerHTML = `<section class="step">
    <div><h2>Checks and export</h2><p class="lede">Validation runs on unrounded rupee figures. The Excel workbook keeps live formulas: each statement figure is a SUMIFS on the mapped trial balance, so edits in the TB sheet flow through to the notes and statements.</p></div>
    <div class="cols">
      <div class="checks">${cks.map(c => `<div class="ck ${c.lvl}"><span class="st">${LBL[c.lvl]}</span><div><b>${esc(c.title)}</b><p>${esc(c.detail)}</p>${c.items ? `<ul>${c.items.slice(0,12).map(i=>`<li>${esc(i)}</li>`).join('')}${c.items.length>12?`<li>…and ${c.items.length-12} more</li>`:''}</ul>` : ''}</div></div>`).join('')}</div>
      <div class="panel"><h3>Export</h3>
        <p class="hint" style="margin:8px 0 12px">Workbook sheets: Balance Sheet, Profit and Loss, Notes, TB (with mapping), Inventory, Checks, Info.${errs ? ` <b style="color:var(--err)">${errs} check(s) still need fixing.</b>` : ''}</p>
        <div class="btns"><button class="btn primary" id="bXlsx">Download Excel workbook</button><button class="btn" id="bJson">Save client file (.json)</button></div>
        <p class="hint" style="margin-top:12px">The client file stores the TB, mapping, inventories and company details so the work can be reopened later or on another computer.</p>
      </div>
    </div></section>`;
  $('#bJson').onclick = () => saveFile(`${safeName(st.company.name)} - ${fyLabel(st.company.fyEnd)} - FS client file.json`, JSON.stringify({ app:'drn-fs', v:1, state:st }, null, 1));
  $('#bXlsx').onclick = async () => {
    if (!window.ExcelJS) { toast('Excel library did not load. Check your connection and reload.'); return; }
    const b = $('#bXlsx'); b.disabled = true; b.textContent = 'Building workbook…';
    try {
      const c = st.company;
      const wb = window.FSExport.buildWorkbook(window.ExcelJS, E, st, r, { fy: fyLabel(c.fyEnd), cyDate: longDate(c.fyEnd), pyDate: longDate(c.pyEnd),
        cyCol: `${fyLabel(c.fyEnd)} (${longDate(c.fyEnd)})`, pyCol: `${fyLabel(c.pyEnd)} (${longDate(c.pyEnd)})` });
      const buf = await wb.xlsx.writeBuffer();
      await saveFile(`${safeName(c.name)} - ${FW()==='nce' ? 'NCE' : 'Schedule III'} FS - ${fyLabel(c.fyEnd)}.xlsx`, new Blob([buf]));
    } catch(e){ toast('Export failed: ' + e.message); }
    b.disabled = false; b.textContent = 'Download Excel workbook';
  };
}

/* ---------- boot ---------- */
const prev = LS.get('drnfs.session');
if (prev && prev.sample) { try { localStorage.removeItem('drnfs.session'); } catch(e){} }   // purge a stored sample session
if (prev && prev.ledgers && prev.ledgers.length && !prev.sample) { st = prev; st.company = Object.assign(blankCo(), st.company); } else loadBlank();   // an older stored sample session is dropped
render();
fetch('/api/ping').then(r => r.json()).then(async j => { if (j && j.bridge) { view.bridge = true; view.srv = j; render();
  if (j.db) await dbBoot();
  const t = TL(); if (t.auto && !st.empty) refreshTally(true); } }).catch(() => {});
})();
</script>
